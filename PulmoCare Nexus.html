function spark(a,c='var(--teal)'){const w=84,h=28,mx=Math.max(...a),mn=Math.min(...a);const p=a.map((v,i)=>[+(i*(w/(a.length-1))).toFixed(1),+(h-4-(v-mn)/(mx-mn||1)*(h-9)).toFixed(1)]);const l=p.map(x=>x.join(',')).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polygon points="0,${h} ${l} ${w},${h}" style="fill:${c};opacity:.14"/><polyline points="${l}" style="fill:none;stroke:${c};stroke-width:1.8"/><circle cx="${p.at(-1)[0]}" cy="${p.at(-1)[1]}" r="2.6" style="fill:${c}"/></svg>`}
function chart(kind,labels,series,max){const W=520,H=210,L=34,B=26,T=10,R=8;const m=max||Math.max(...series.flatMap(s=>s.d))*1.15;const x=i=>L+(i+.5)*(W-L-R)/labels.length,y=v=>T+(H-T-B)*(1-v/m);let o=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;for(let i=0;i<=4;i++){const v=m*i/4;o+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" style="fill:var(--ink2)">${Math.round(v)}</text>`}labels.forEach((l,i)=>o+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" style="fill:var(--ink2)">${esc(l)}</text>`);const n=series.length,bw=Math.min(26,(W-L-R)/labels.length/(n+.6));series.forEach((s,k)=>{if(kind==='bar'){s.d.forEach((v,i)=>{const bx=x(i)-n*bw/2+k*bw;o+=`<rect x="${bx}" y="${y(v)}" width="${bw-2}" height="${y(0)-y(v)}" rx="3" style="fill:${s.c}"><title>${esc(s.n)}: ${v}</title></rect>`})}else{const pts=s.d.map((v,i)=>x(i)+','+y(v)).join(' ');o+=`<polyline points="${pts}" style="fill:none;stroke:${s.c};stroke-width:2.4;stroke-linejoin:round"/>`;s.d.forEach((v,i)=>o+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" style="fill:${s.c}"><title>${esc(s.n)}: ${v}</title></circle>`)}});o+='</svg>';if(series.length>1||series[0].n)o+=`<div class="row sm muted" style="margin-top:4px">${series.map(s=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${s.c};margin-right:5px"></i>${esc(s.n)}</span>`).join('')}</div>`;return o}
function donut(items){const tot=items.reduce((a,b)=>a+b[1],0)||1;let off=0;const r=42,C=2*Math.PI*r;let o=`<svg viewBox="0 0 120 120" style="width:130px;flex:none"><g transform="rotate(-90 60 60)">`;items.forEach(([n,v,c])=>{const len=v/tot*C;o+=`<circle cx="60" cy="60" r="${r}" fill="none" stroke-width="16" style="stroke:${c}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"><title>${esc(n)}: ${v}</title></circle>`;off+=len});o+=`</g><text x="60" y="65" text-anchor="middle" font-size="20" font-weight="700" style="fill:var(--ink)">${tot}</text></svg>`;return `<div class="row" style="flex-wrap:nowrap;gap:16px">${o}<div class="sm">${items.map(([n,v,c])=>`<div><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${c};margin-right:6px"></i>${esc(n)} <b>${v}</b></div>`).join('')}</div></div>`}

S.f.ws=0;const h=location.hash.slice(1);if(V[h])S.route=h;S.anim=1;render();
